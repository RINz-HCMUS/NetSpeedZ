<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Z Neon Gradient -->
    <linearGradient id="zNeonGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Core High-Voltage Spark Gradient -->
    <linearGradient id="zCoreGrad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Speed Lines Gradient -->
    <linearGradient id="speedStreakGrad" x1="20" y1="20" x2="100" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonSparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Shadow & Ambient Aura -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#auraGlow)"/>

  <!-- Badge Container Squircle -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Inner Scale Matrix (Scale 48x48 up to 76x76 placed at center 22,22) -->
  <g transform="translate(22, 22) scale(1.5833)">
    <!-- Speed Telemetry Background Arcs -->
    <path d="M 10 14 C 18 8, 30 8, 38 14" stroke="url(#speedStreakGrad)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.75"/>
    <path d="M 10 34 C 18 40, 30 40, 38 34" stroke="url(#speedStreakGrad)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.6"/>

    <!-- Depth Shadow Silhouette -->
    <path d="M 11 11 H 37 C 38.2 11 39 12.3 38.3 13.3 L 26.5 22.5 H 33.5 C 34.6 22.5 35.3 23.7 34.7 24.7 L 21 40 C 20.2 40.9 18.7 40.3 19.1 39.1 L 22.5 28.5 H 14.5 C 13.4 28.5 12.7 27.3 13.3 26.3 L 22 17 H 11 C 9.9 17 9.2 15.8 9.8 14.8 L 11 11 Z" fill="#020617" opacity="0.75" transform="translate(1, 1.5)"/>

    <!-- Primary Aerodynamic Z-Bolt Emblem -->
    <path d="M 10 10.5 H 36.5 C 37.8 10.5 38.6 11.9 37.9 13.0 L 26.2 22 H 33.2 C 34.4 22 35.1 23.3 34.4 24.3 L 20.8 39.2 C 19.9 40.1 18.4 39.5 18.8 38.2 L 22.3 28 H 14.2 C 13.0 28 12.3 26.7 13.0 25.7 L 22.2 16.2 H 10 C 8.9 16.2 8.2 15.0 8.8 14.0 L 10 10.5 Z" fill="url(#zNeonGrad)" stroke="#38bdf8" stroke-width="0.85" stroke-linejoin="round"/>

    <!-- Internal Specular Facet -->
    <path d="M 12.5 12.2 H 34.2 L 24.8 19.5 H 17.5 L 12.5 12.2 Z" fill="url(#zCoreGrad)" opacity="0.9"/>

    <!-- Central Lightning Discharge Slash -->
    <path d="M 23 23.5 L 31.8 23.5 L 20 36.5 L 22.2 28.5 L 15.5 28.5 L 23 23.5 Z" fill="#ffffff" filter="url(#neonSparkGlow)"/>

    <!-- Spark Point Beacon -->
    <circle cx="39.5" cy="11.5" r="2.2" fill="#22d3ee" opacity="0.5"/>
    <circle cx="39.5" cy="11.5" r="1.4" fill="#ffffff"/>
    <circle cx="8.5" cy="36.5" r="1.2" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>
