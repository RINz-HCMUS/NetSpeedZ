<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="920" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="gaugeSpeedArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="90%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="540" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="918" height="538" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header / Browser Bar Mockup -->
  <rect x="1" y="1" width="918" height="42" rx="15" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
  <rect x="1" y="24" width="918" height="18" fill="#0b1329"/>
  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
  <!-- URL Pill -->
  <rect x="260" y="10" width="400" height="22" rx="11" fill="#030712" stroke="#1e293b"/>
  <circle cx="276" cy="21" r="3.5" fill="#10b981"/>
  <text x="290" y="25" fill="#94a3b8" font-size="11" class="font-sans">https://net-speedz.vercel.app/ • Client-Side Direct Engine</text>

  <!-- ================= APP HEADER ================= -->
  <g transform="translate(30, 60)">
    <!-- Brand Logo -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M9 10 L23 10 L13 22 L23 22" stroke="url(#cyanBlueGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="22" fill="#f8fafc" font-size="17" font-weight="800" letter-spacing="-0.02em" class="font-sans">NetSpeed<tspan fill="url(#cyanBlueGrad)">Z</tspan></text>
    <rect x="138" y="7" width="54" height="18" rx="5" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
    <text x="145" y="19" fill="#38bdf8" font-size="9.5" font-weight="700" class="font-mono">v2.4.0</text>

    <!-- Top Server Indicator -->
    <g transform="translate(370, 2)">
      <rect x="0" y="0" width="280" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="14" r="3.5" fill="#10b981"/>
      <text x="28" y="18" fill="#94a3b8" font-size="11" class="font-sans">Máy chủ:</text>
      <text x="80" y="18" fill="#f1f5f9" font-size="11" font-weight="600" class="font-sans">🇻🇳 VNPT Ho Chi Minh City</text>
      <rect x="232" y="5" width="40" height="18" rx="4" fill="#082f49" stroke="#0369a1" stroke-width="0.8"/>
      <text x="236" y="17" fill="#38bdf8" font-size="9" font-weight="700" class="font-mono">SGN</text>
    </g>

    <!-- Header Actions -->
    <rect x="800" y="2" width="28" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="814" cy="16" r="6" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
    <path d="M814 13 L814 17 M814 19 L814 20" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="834" y="2" width="28" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <path d="M848 10 C844 12 843 17 845 20 C847 23 851 23 853 21 C850 21 847 18 848 10 Z" fill="#38bdf8"/>
  </g>

  <!-- ================= MAIN GRID ================= -->
  <!-- 1. LEFT CARD: CENTRAL SPEEDOMETER (col-span-7) -->
  <g transform="translate(30, 110)" filter="url(#softShadow)">
    <rect width="490" height="380" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Server Row Header inside Card -->
    <g transform="translate(20, 20)">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="20" y="12" fill="#94a3b8" font-size="11.5" font-weight="500" class="font-sans">Hạ tầng đo:</text>
      <text x="82" y="12" fill="#f8fafc" font-size="11.5" font-weight="700" class="font-sans">Anycast Edge PoP • SGN-01</text>
      <rect x="250" y="2" width="55" height="17" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
      <text x="255" y="14" fill="#38bdf8" font-size="9" font-weight="700" class="font-mono">VN-10G</text>

      <!-- Change Server Button -->
      <rect x="360" y="-1" width="88" height="22" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
      <text x="372" y="14" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">Đổi trạm đo →</text>
    </g>

    <!-- Speedometer Dial Graphic -->
    <g transform="translate(245, 200)">
      <!-- Outer Track Glow -->
      <circle cx="0" cy="0" r="115" stroke="#1e293b" stroke-width="2" stroke-dasharray="3 7" fill="none"/>

      <!-- Gauge Background Track -->
      <circle cx="0" cy="0" r="95" stroke="#1e293b" stroke-width="12" stroke-dasharray="415 597" stroke-linecap="round" fill="none" transform="rotate(145)"/>

      <!-- Redline highlight arc -->
      <circle cx="0" cy="0" r="95" stroke="#ef4444" stroke-width="12" stroke-dasharray="50 597" stroke-dashoffset="-365" stroke-linecap="round" fill="none" opacity="0.35" transform="rotate(145)"/>

      <!-- Active Speed Sweep Laser Arc (up to ~485 Mbps) -->
      <circle cx="0" cy="0" r="95" stroke="url(#gaugeSpeedArc)" stroke-width="12" stroke-dasharray="320 597" stroke-linecap="round" fill="none" filter="url(#glowG)" transform="rotate(145)"/>

      <!-- Dial Scale Tick Labels -->
      <text x="-95" y="65" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">0</text>
      <text x="-105" y="0" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">50</text>
      <text x="-80" y="-70" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">100</text>
      <text x="0" y="-105" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">250</text>
      <text x="80" y="-70" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">500</text>
      <text x="95" y="65" fill="#ef4444" font-size="11" font-weight="800" text-anchor="middle" class="font-mono">1G</text>

      <!-- Center Big Metric Display -->
      <text x="0" y="-12" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.03em" class="font-sans" filter="url(#glowG)">485.6</text>
      <text x="0" y="12" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.1em" class="font-mono">MBPS</text>
      <rect x="-60" y="24" width="120" height="20" rx="10" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <circle cx="-46" cy="34" r="3" fill="#10b981"/>
      <text x="4" y="38" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle" class="font-sans">ĐÃ HOÀN TẤT</text>

      <!-- Center Hub Needle Cap -->
      <circle cx="0" cy="85" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="85" r="5" fill="#38bdf8"/>
      <!-- Needle pointing to 485 Mbps (~58 deg) -->
      <polygon points="0,85 -3,80 62,-2 0,85" fill="#ef4444" opacity="0.95"/>
    </g>

    <!-- Sub-status bottom bar -->
    <g transform="translate(20, 340)">
      <line x1="0" y1="0" x2="450" y2="0" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="22" fill="#64748b" font-size="11" class="font-sans">Thuật toán đo:</text>
      <text x="85" y="22" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">Multi-Thread WebStreams (8 HTTPS chunks)</text>
      <text x="350" y="22" fill="#10b981" font-size="11" font-weight="600" class="font-sans">● Băng thông đạt đỉnh</text>
    </g>
  </g>

  <!-- 2. RIGHT CARDS: 4 METRICS (col-span-5) -->
  <g transform="translate(540, 110)">
    <!-- Metric 1: Ping -->
    <g transform="translate(0, 0)" filter="url(#softShadow)">
      <rect width="160" height="120" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#082f49"/>
      <circle cx="28" cy="28" r="6" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <path d="M28 25 L28 28 L30 30" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="50" y="32" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">ĐỘ TRỄ PING</text>
      <text x="16" y="80" fill="#ffffff" font-size="32" font-weight="800" class="font-sans">4.0</text>
      <text x="74" y="80" fill="#64748b" font-size="13" font-weight="600" class="font-mono">ms</text>
      <rect x="16" y="92" width="76" height="16" rx="4" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
      <text x="23" y="103" fill="#34d399" font-size="9" font-weight="700" class="font-sans">Rất xuất sắc</text>
    </g>

    <!-- Metric 2: Jitter -->
    <g transform="translate(175, 0)" filter="url(#softShadow)">
      <rect width="160" height="120" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#1e1b4b"/>
      <path d="M20 28 L24 23 L28 33 L32 25 L36 28" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="50" y="32" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">BIẾN THIÊN JITTER</text>
      <text x="16" y="80" fill="#ffffff" font-size="32" font-weight="800" class="font-sans">0.8</text>
      <text x="74" y="80" fill="#64748b" font-size="13" font-weight="600" class="font-mono">ms</text>
      <rect x="16" y="92" width="76" height="16" rx="4" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
      <text x="23" y="103" fill="#34d399" font-size="9" font-weight="700" class="font-sans">Cực kỳ ổn định</text>
    </g>

    <!-- Metric 3: Download -->
    <g transform="translate(0, 135)" filter="url(#softShadow)">
      <rect width="160" height="125" rx="16" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#082f49"/>
      <path d="M28 20 L28 32 M24 28 L28 32 L32 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="32" fill="#38bdf8" font-size="11" font-weight="700" class="font-sans">TẢI XUỐNG</text>
      <text x="16" y="82" fill="#ffffff" font-size="30" font-weight="900" class="font-sans" filter="url(#glowG)">485.6</text>
      <text x="110" y="82" fill="#38bdf8" font-size="12" font-weight="700" class="font-mono">Mbps</text>
      <text x="16" y="106" fill="#94a3b8" font-size="10" class="font-sans">Đỉnh: <tspan fill="#f1f5f9" font-weight="700">520.4 Mbps</tspan></text>
    </g>

    <!-- Metric 4: Upload -->
    <g transform="translate(175, 135)" filter="url(#softShadow)">
      <rect width="160" height="125" rx="16" fill="url(#cardGrad)" stroke="#7e22ce" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#2e1065"/>
      <path d="M28 32 L28 20 M24 24 L28 20 L32 24" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="32" fill="#c084fc" font-size="11" font-weight="700" class="font-sans">TẢI LÊN</text>
      <text x="16" y="82" fill="#ffffff" font-size="30" font-weight="900" class="font-sans">124.2</text>
      <text x="110" y="82" fill="#c084fc" font-size="12" font-weight="700" class="font-mono">Mbps</text>
      <text x="16" y="106" fill="#94a3b8" font-size="10" class="font-sans">Đỉnh: <tspan fill="#f1f5f9" font-weight="700">138.5 Mbps</tspan></text>
    </g>

    <!-- Retest Big Action Button -->
    <g transform="translate(0, 275)" filter="url(#softShadow)">
      <rect width="335" height="46" rx="14" fill="#2563eb" stroke="#3b82f6" stroke-width="1.2"/>
      <path d="M110 23 C110 18 114 14 119 14 C123 14 126 17 127 20 M128 14 L128 20 L122 20" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="175" y="28" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" class="font-sans">KIỂM TRA LẠI TỐC ĐỘ</text>
    </g>

    <!-- NQS Rating Chip -->
    <g transform="translate(0, 335)">
      <rect width="335" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="22" cy="21" r="7" fill="#10b981"/>
      <path d="M19 21 L21 23 L26 18" stroke="#ffffff" stroke-width="1.8" fill="none"/>
      <text x="36" y="25" fill="#f8fafc" font-size="11" font-weight="700" class="font-sans">Phân hạng chất lượng NQS: <tspan fill="#34d399">A+ (Đường truyền cao cấp)</tspan></text>
    </g>
  </g>

  <!-- ================= RIGHT FLOATING NAVIGATION (TOC) ================= -->
  <g transform="translate(890, 200)">
    <circle cx="10" cy="10" r="14" fill="#082f49" stroke="#0284c7" stroke-width="1.2" opacity="0.95"/>
    <circle cx="10" cy="10" r="4" fill="#38bdf8"/>
    <!-- Active Indicator -->
    <circle cx="21" cy="4" r="2.5" fill="#22d3ee"/>

    <circle cx="10" cy="46" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <path d="M6 46 L8 42 L10 50 L12 44 L14 46" stroke="#38bdf8" stroke-width="1.2" fill="none"/>

    <circle cx="10" cy="82" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <circle cx="10" cy="82" r="4" stroke="#38bdf8" stroke-width="1.2" fill="none"/>

    <circle cx="10" cy="118" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <path d="M6 118 A6 6 0 0 1 14 118" stroke="#38bdf8" stroke-width="1.2" fill="none"/>

    <circle cx="10" cy="154" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <circle cx="10" cy="154" r="5" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  </g>
</svg>
