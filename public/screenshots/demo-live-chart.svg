<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="920" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="chartCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Download Wave Area Gradient (Cyan) -->
    <linearGradient id="dlAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Upload Wave Area Gradient (Purple) -->
    <linearGradient id="ulAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#7e22ce" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glowWave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="440" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="918" height="438" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card Container -->
  <g transform="translate(25, 20)" filter="url(#shadowBox)">
    <rect width="870" height="400" rx="20" fill="url(#chartCardGrad)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header Section -->
    <g transform="translate(24, 22)">
      <!-- Title & Live Status Indicator -->
      <g>
        <circle cx="8" cy="8" r="4" fill="#10b981"/>
        <circle cx="8" cy="8" r="8" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
        <text x="26" y="12" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Biểu đồ Băng thông &amp; Telemetry Thời gian thực</text>
        <rect x="355" y="0" width="135" height="22" rx="6" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="364" y="15" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">● Đã chốt telemetry (12s)</text>
      </g>

      <!-- Legend Filters & Multi-line Indicators -->
      <g transform="translate(530, 0)">
        <!-- Download Pill -->
        <rect x="0" y="0" width="145" height="26" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
        <rect x="8" y="9" width="14" height="8" rx="2" fill="#06b6d4"/>
        <text x="28" y="17" fill="#38bdf8" font-size="11" font-weight="700" class="font-sans">Tải xuống:</text>
        <text x="88" y="17" fill="#ffffff" font-size="11" font-weight="800" class="font-mono">485.6M</text>

        <!-- Upload Pill -->
        <rect x="155" y="0" width="135" height="26" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
        <rect x="163" y="9" width="14" height="8" rx="2" fill="#c084fc"/>
        <text x="183" y="17" fill="#c084fc" font-size="11" font-weight="700" class="font-sans">Tải lên:</text>
        <text x="230" y="17" fill="#ffffff" font-size="11" font-weight="800" class="font-mono">124.2M</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="24" y1="62" x2="846" y2="62" stroke="#1e293b" stroke-width="1"/>

    <!-- ================= SVG PLOT CANVAS ================= -->
    <g transform="translate(24, 80)">
      <!-- Plot Area Dimensions: W=820, H=260 -->
      <!-- Y-Axis Grid Lines & Tick Labels (0 to 500 Mbps) -->
      <!-- 500 Mbps -->
      <line x1="50" y1="20" x2="810" y2="20" stroke="#1e293b" stroke-dasharray="3 4"/>
      <text x="40" y="24" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end" class="font-mono">500M</text>

      <!-- 400 Mbps -->
      <line x1="50" y1="70" x2="810" y2="70" stroke="#1e293b" stroke-dasharray="3 4"/>
      <text x="40" y="74" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end" class="font-mono">400M</text>

      <!-- 300 Mbps -->
      <line x1="50" y1="120" x2="810" y2="120" stroke="#1e293b" stroke-dasharray="3 4"/>
      <text x="40" y="124" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end" class="font-mono">300M</text>

      <!-- 200 Mbps -->
      <line x1="50" y1="170" x2="810" y2="170" stroke="#1e293b" stroke-dasharray="3 4"/>
      <text x="40" y="174" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end" class="font-mono">200M</text>

      <!-- 100 Mbps -->
      <line x1="50" y1="220" x2="810" y2="220" stroke="#1e293b" stroke-dasharray="3 4"/>
      <text x="40" y="224" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end" class="font-mono">100M</text>

      <!-- 0 Mbps Base Line -->
      <line x1="50" y1="260" x2="810" y2="260" stroke="#334155" stroke-width="1.2"/>
      <text x="40" y="264" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="end" class="font-mono">0M</text>

      <!-- X-Axis Time Ticks (0s to 12s) -->
      <text x="50" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">0s</text>
      <text x="176" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">2s</text>
      <text x="303" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">4s</text>
      <text x="430" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">6s</text>
      <text x="556" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">8s</text>
      <text x="683" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">10s</text>
      <text x="810" y="280" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">12s</text>

      <!-- ================= UPLOAD SERIES (PURPLE AREA + LINE) ================= -->
      <path d="M 50 260 
               L 90 250 
               Q 140 240, 200 215 
               T 340 200 
               T 460 198 
               T 580 198 
               T 700 197 
               L 810 197 
               L 810 260 Z" fill="url(#ulAreaGrad)"/>

      <path d="M 50 260 
               L 90 250 
               Q 140 240, 200 215 
               T 340 200 
               T 460 198 
               T 580 198 
               T 700 197 
               L 810 197" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- ================= DOWNLOAD SERIES (CYAN AREA + LINE) ================= -->
      <path d="M 50 260 
               L 90 220 
               Q 140 120, 220 55 
               T 340 32 
               T 450 28 
               T 560 30 
               T 680 26 
               L 810 27 
               L 810 260 Z" fill="url(#dlAreaGrad)"/>

      <path d="M 50 260 
               L 90 220 
               Q 140 120, 220 55 
               T 340 32 
               T 450 28 
               T 560 30 
               T 680 26 
               L 810 27" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glowWave)"/>

      <!-- ================= INTERACTIVE CURSOR & TOOLTIP AT T=6.5s ================= -->
      <!-- Vertical Laser Guide Line at X=462 (T=6.5s) -->
      <line x1="462" y1="15" x2="462" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Download Intersection Point -->
      <circle cx="462" cy="28" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Upload Intersection Point -->
      <circle cx="462" cy="198" r="5" fill="#7e22ce" stroke="#ffffff" stroke-width="2"/>

      <!-- Floating Tooltip Box -->
      <g transform="translate(475, 40)" filter="url(#shadowBox)">
        <rect width="210" height="92" rx="12" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="14" y="22" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">Thời điểm đo: <tspan fill="#ffffff" font-weight="700">6.5 giây</tspan></text>
        <line x1="14" y1="32" x2="196" y2="32" stroke="#1e293b"/>

        <!-- Tooltip DL Metric -->
        <circle cx="20" cy="48" r="3.5" fill="#06b6d4"/>
        <text x="30" y="52" fill="#38bdf8" font-size="11" font-weight="600" class="font-sans">Tải xuống:</text>
        <text x="120" y="52" fill="#ffffff" font-size="12" font-weight="800" class="font-mono">492.1 Mbps</text>

        <!-- Tooltip UL Metric -->
        <circle cx="20" cy="72" r="3.5" fill="#a855f7"/>
        <text x="30" y="76" fill="#c084fc" font-size="11" font-weight="600" class="font-sans">Tải lên:</text>
        <text x="120" y="76" fill="#ffffff" font-size="12" font-weight="800" class="font-mono">128.4 Mbps</text>
      </g>
    </g>
  </g>
</svg>
