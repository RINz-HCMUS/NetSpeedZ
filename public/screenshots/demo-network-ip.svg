<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="920" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadowCard4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="380" rx="16" fill="url(#bgGrad4)"/>
  <rect x="1" y="1" width="918" height="378" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Card Container -->
  <g transform="translate(25, 20)" filter="url(#shadowCard4)">
    <rect width="870" height="340" rx="20" fill="url(#cardGrad4)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header Section -->
    <g transform="translate(24, 22)">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="24" y="12" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Thông số Mạng &amp; Nhận diện Dual-Stack IPv4 / IPv6</text>
      <text x="24" y="30" fill="#94a3b8" font-size="11.5" class="font-sans">Tự động phân giải địa chỉ mạng ngoại vi, vị trí địa lý và kiểm tra tính toàn vẹn kết nối trực tiếp</text>

      <!-- Refresh Info Button -->
      <g transform="translate(730, -4)">
        <rect width="95" height="28" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
        <text x="47" y="18" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Cập nhật ⟳</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="24" y1="68" x2="846" y2="68" stroke="#1e293b" stroke-width="1"/>

    <!-- ================= GRID: DUAL-STACK IP BOXES ================= -->
    <g transform="translate(24, 85)">
      <!-- Left Box: IPv4 -->
      <g transform="translate(0, 0)">
        <rect width="400" height="150" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <g transform="translate(18, 16)">
          <text x="0" y="12" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">Địa chỉ IPv4 Công cộng</text>
          
          <!-- Actions: Hide/Show + Copy -->
          <rect x="235" y="-3" width="55" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
          <text x="248" y="12" fill="#cbd5e1" font-size="10.5" class="font-sans">👁 Ẩn</text>
          
          <rect x="296" y="-3" width="58" height="22" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
          <text x="306" y="12" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">⎘ Chép</text>

          <!-- IP Value -->
          <text x="0" y="55" fill="#ffffff" font-size="22" font-weight="800" class="font-mono">14.169.182.204</text>
          
          <!-- Details Bottom Line -->
          <line x1="0" y1="75" x2="364" y2="75" stroke="#1e293b"/>
          <g transform="translate(0, 95)">
            <rect x="0" y="-12" width="135" height="18" rx="4" fill="#082f49"/>
            <text x="6" y="1" fill="#38bdf8" font-size="10" font-weight="700" class="font-sans">🇻🇳 VNPT Corp (AS131429)</text>
            <text x="145" y="1" fill="#94a3b8" font-size="10.5" class="font-sans">Khu vực: <tspan fill="#f1f5f9" font-weight="600">TP. Hồ Chí Minh</tspan></text>
          </g>
        </g>
      </g>

      <!-- Right Box: IPv6 -->
      <g transform="translate(420, 0)">
        <rect width="400" height="150" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <g transform="translate(18, 16)">
          <text x="0" y="12" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">Địa chỉ IPv6 Thế hệ mới</text>
          
          <!-- Actions: Hide/Show + Copy -->
          <rect x="235" y="-3" width="55" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
          <text x="248" y="12" fill="#cbd5e1" font-size="10.5" class="font-sans">👁 Ẩn</text>
          
          <rect x="296" y="-3" width="58" height="22" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
          <text x="306" y="12" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">⎘ Chép</text>

          <!-- IPv6 Value -->
          <text x="0" y="52" fill="#38bdf8" font-size="14.5" font-weight="700" class="font-mono">2001:ee0:4fcd:ac80:9c21:9c5e:2427:c9b9</text>
          
          <!-- Details Bottom Line -->
          <line x1="0" y1="75" x2="364" y2="75" stroke="#1e293b"/>
          <g transform="translate(0, 95)">
            <rect x="0" y="-12" width="135" height="18" rx="4" fill="#022c22"/>
            <text x="6" y="1" fill="#34d399" font-size="10" font-weight="700" class="font-sans">● IPv6 Native Sẵn sàng</text>
            <text x="145" y="1" fill="#94a3b8" font-size="10.5" class="font-sans">Giao thức: <tspan fill="#f1f5f9" font-weight="600">Dual-Stack Online</tspan></text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Shield Banner -->
    <g transform="translate(24, 255)">
      <rect width="820" height="52" rx="12" fill="#021f30" stroke="#0369a1" stroke-width="1"/>
      <g transform="translate(20, 26)">
        <!-- Shield Icon -->
        <path d="M0 -10 L10 -14 L20 -10 L20 2 C20 10 10 14 10 14 C10 14 0 10 0 2 Z" stroke="#38bdf8" stroke-width="1.6" fill="#082f49"/>
        <path d="M7 1 L9 4 L14 -3" stroke="#38bdf8" stroke-width="1.6" fill="none"/>
        <text x="32" y="3" fill="#ffffff" font-size="12" font-weight="700" class="font-sans">Cam kết Bảo mật Tuyệt đối &amp; Zero Tracking:</text>
        <text x="285" y="3" fill="#94a3b8" font-size="11.5" class="font-sans">Toàn bộ địa chỉ IP và dữ liệu đo kiểm chỉ lưu cục bộ trên máy bạn, không gửi về bất kỳ máy chủ nào.</text>
      </g>
    </g>
  </g>
</svg>
