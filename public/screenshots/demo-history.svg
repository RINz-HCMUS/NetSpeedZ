<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="920" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cardGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="trendAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="shadowCard5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="420" rx="16" fill="url(#bgGrad5)"/>
  <rect x="1" y="1" width="918" height="418" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Card Container -->
  <g transform="translate(25, 20)" filter="url(#shadowCard5)">
    <rect width="870" height="380" rx="20" fill="url(#cardGrad5)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header Section -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="24" y="12" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Lịch sử Đo kiểm &amp; Phân tích Xu hướng Băng thông</text>
      <rect x="365" y="-1" width="70" height="20" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
      <text x="375" y="12" fill="#38bdf8" font-size="10.5" font-weight="700" class="font-sans">12 lượt đo</text>

      <!-- Action Buttons Right -->
      <g transform="translate(560, -4)">
        <!-- Toggle Trend Button -->
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="14" y="17" fill="#cbd5e1" font-size="10.5" class="font-sans">📊 Xu hướng</text>

        <!-- Export CSV -->
        <rect x="92" y="0" width="88" height="26" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
        <text x="103" y="17" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">↓ Xuất CSV</text>

        <!-- Export JSON -->
        <rect x="187" y="0" width="92" height="26" rx="6" fill="#1e1b4b" stroke="#7e22ce" stroke-width="0.8"/>
        <text x="198" y="17" fill="#c084fc" font-size="10.5" font-weight="600" class="font-sans">{ } Xuất JSON</text>
      </g>
    </g>

    <!-- Mini Trend Sparkline Graph -->
    <g transform="translate(24, 60)">
      <rect width="820" height="75" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="20" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">Biểu đồ xu hướng 8 lần đo gần nhất (Download / Upload)</text>
      
      <!-- Sparkline Area -->
      <path d="M 40 58 L 140 48 L 240 45 L 340 38 L 440 32 L 540 28 L 640 25 L 780 24 L 780 65 L 40 65 Z" fill="url(#trendAreaGrad)"/>
      <!-- Download Line -->
      <path d="M 40 58 L 140 48 L 240 45 L 340 38 L 440 32 L 540 28 L 640 25 L 780 24" stroke="#22d3ee" stroke-width="2.5" fill="none"/>
      <!-- Upload Line -->
      <path d="M 40 62 L 140 60 L 240 58 L 340 56 L 440 55 L 540 54 L 640 53 L 780 52" stroke="#c084fc" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
      
      <!-- Dots on Last Point -->
      <circle cx="780" cy="24" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <text x="735" y="18" fill="#38bdf8" font-size="10" font-weight="700" class="font-mono">485.6M</text>
    </g>

    <!-- Data Table Container -->
    <g transform="translate(24, 150)">
      <!-- Table Header Row -->
      <rect width="820" height="32" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="21" fill="#94a3b8" font-size="11" font-weight="700" class="font-sans">THỜI GIAN</text>
      <text x="160" y="21" fill="#94a3b8" font-size="11" font-weight="700" class="font-sans">MÁY CHỦ KIỂM TRA</text>
      <text x="360" y="21" fill="#94a3b8" font-size="11" font-weight="700" class="font-sans">PING / JITTER</text>
      <text x="490" y="21" fill="#38bdf8" font-size="11" font-weight="700" class="font-sans">TẢI XUỐNG</text>
      <text x="610" y="21" fill="#c084fc" font-size="11" font-weight="700" class="font-sans">TẢI LÊN</text>
      <text x="720" y="21" fill="#94a3b8" font-size="11" font-weight="700" class="font-sans">PHÂN HẠNG</text>

      <!-- Row 1 (Latest) -->
      <g transform="translate(0, 38)">
        <rect width="820" height="38" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="20" y="24" fill="#ffffff" font-size="11" font-weight="600" class="font-mono">Vừa xong (12/09)</text>
        <text x="160" y="24" fill="#cbd5e1" font-size="11.5" class="font-sans">🇻🇳 VNPT SGN-01 (Anycast)</text>
        <text x="360" y="24" fill="#34d399" font-size="11.5" font-weight="700" class="font-mono">4.0 ms <tspan fill="#64748b" font-weight="500">/ 0.8ms</tspan></text>
        <text x="490" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="font-mono">485.6 Mbps</text>
        <text x="610" y="24" fill="#c084fc" font-size="12" font-weight="800" class="font-mono">124.2 Mbps</text>
        <rect x="720" y="9" width="46" height="20" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="734" y="23" fill="#34d399" font-size="11" font-weight="800" class="font-sans">A+</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 80)">
        <rect width="820" height="38" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="0.8"/>
        <text x="20" y="24" fill="#94a3b8" font-size="11" font-weight="600" class="font-mono">10:15 - 12/09</text>
        <text x="160" y="24" fill="#cbd5e1" font-size="11.5" class="font-sans">🇻🇳 Viettel Cloud Hanoi</text>
        <text x="360" y="24" fill="#34d399" font-size="11.5" font-weight="700" class="font-mono">18.5 ms <tspan fill="#64748b" font-weight="500">/ 1.4ms</tspan></text>
        <text x="490" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="font-mono">442.1 Mbps</text>
        <text x="610" y="24" fill="#c084fc" font-size="12" font-weight="800" class="font-mono">115.0 Mbps</text>
        <rect x="720" y="9" width="46" height="20" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="734" y="23" fill="#34d399" font-size="11" font-weight="800" class="font-sans">A+</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 122)">
        <rect width="820" height="38" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="20" y="24" fill="#94a3b8" font-size="11" font-weight="600" class="font-mono">08:30 - 12/09</text>
        <text x="160" y="24" fill="#cbd5e1" font-size="11.5" class="font-sans">🇸🇬 Singtel Singapore PoP</text>
        <text x="360" y="24" fill="#38bdf8" font-size="11.5" font-weight="700" class="font-mono">32.1 ms <tspan fill="#64748b" font-weight="500">/ 2.2ms</tspan></text>
        <text x="490" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="font-mono">320.4 Mbps</text>
        <text x="610" y="24" fill="#c084fc" font-size="12" font-weight="800" class="font-mono">92.6 Mbps</text>
        <rect x="720" y="9" width="46" height="20" rx="5" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
        <text x="738" y="23" fill="#38bdf8" font-size="11" font-weight="800" class="font-sans">A</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 164)">
        <rect width="820" height="38" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="0.8"/>
        <text x="20" y="24" fill="#94a3b8" font-size="11" font-weight="600" class="font-mono">22:45 - 11/09</text>
        <text x="160" y="24" fill="#cbd5e1" font-size="11.5" class="font-sans">🇻🇳 VNPT SGN-01 (Anycast)</text>
        <text x="360" y="24" fill="#34d399" font-size="11.5" font-weight="700" class="font-mono">4.2 ms <tspan fill="#64748b" font-weight="500">/ 0.9ms</tspan></text>
        <text x="490" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="font-mono">480.0 Mbps</text>
        <text x="610" y="24" fill="#c084fc" font-size="12" font-weight="800" class="font-mono">121.8 Mbps</text>
        <rect x="720" y="9" width="46" height="20" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="734" y="23" fill="#34d399" font-size="11" font-weight="800" class="font-sans">A+</text>
      </g>
    </g>
  </g>
</svg>
