<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="920" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="gradeAGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="shadowCard3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="380" rx="16" fill="url(#bgGrad3)"/>
  <rect x="1" y="1" width="918" height="378" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Card Container -->
  <g transform="translate(25, 20)" filter="url(#shadowCard3)">
    <rect width="870" height="340" rx="20" fill="url(#cardGrad3)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header with Overall NQS Grade -->
    <g transform="translate(24, 22)">
      <circle cx="8" cy="8" r="4" fill="#10b981"/>
      <text x="24" y="12" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Đánh giá Năng lực Tác vụ Thực tế (NQS Framework)</text>
      <text x="24" y="30" fill="#94a3b8" font-size="11.5" class="font-sans">Phân tích đa chiều dựa trên độ trễ không tải, biến thiên jitter và ngưỡng thông lượng thực</text>

      <!-- Grade Badge (A+) -->
      <g transform="translate(680, -6)">
        <rect width="140" height="42" rx="12" fill="#022c22" stroke="#059669" stroke-width="1.2"/>
        <circle cx="24" cy="21" r="14" fill="url(#gradeAGrad)" filter="url(#glowGreen)"/>
        <text x="24" y="26" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle" class="font-sans">A+</text>
        <text x="46" y="18" fill="#34d399" font-size="11.5" font-weight="800" class="font-sans">XUẤT SẮC</text>
        <text x="46" y="32" fill="#6ee7b7" font-size="9" class="font-mono">Điểm số: 98/100</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="24" y1="74" x2="846" y2="74" stroke="#1e293b" stroke-width="1"/>

    <!-- ================= 4 TASK CATEGORY CARDS ================= -->
    <g transform="translate(24, 92)">
      <!-- Card 1: Gaming & Esport -->
      <g transform="translate(0, 0)">
        <rect width="195" height="225" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <!-- Icon Badge -->
        <rect x="16" y="16" width="36" height="36" rx="10" fill="#082f49"/>
        <path d="M26 34 L26 28 L30 28 L30 34 L36 34 L36 38 L30 38 L30 44 L26 44 L26 38 L20 38 L20 34 Z" fill="#38bdf8" transform="scale(0.8) translate(3, 4)"/>
        <circle cx="42" cy="28" r="2" fill="#38bdf8"/>
        <circle cx="45" cy="34" r="2" fill="#38bdf8"/>
        <!-- Title & Status -->
        <text x="16" y="72" fill="#f8fafc" font-size="13" font-weight="700" class="font-sans">Gaming &amp; Esport</text>
        <rect x="16" y="82" width="76" height="18" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="24" y="94" fill="#34d399" font-size="9.5" font-weight="700" class="font-sans">● Xuất sắc</text>
        <!-- Metrics -->
        <text x="16" y="124" fill="#94a3b8" font-size="11" class="font-sans">Ping: <tspan fill="#38bdf8" font-weight="700">4.0 ms</tspan></text>
        <text x="16" y="142" fill="#94a3b8" font-size="11" class="font-sans">Jitter: <tspan fill="#38bdf8" font-weight="700">0.8 ms</tspan></text>
        <line x1="16" y1="156" x2="179" y2="156" stroke="#1e293b"/>
        <!-- Detail Text -->
        <text x="16" y="174" fill="#cbd5e1" font-size="10.5" class="font-sans">Phản xạ tức thời, hoàn hảo</text>
        <text x="16" y="190" fill="#cbd5e1" font-size="10.5" class="font-sans">cho CS2, Valorant, LMHT,</text>
        <text x="16" y="206" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">không phát sinh giật lag.</text>
      </g>

      <!-- Card 2: 4K / 8K Video Streaming -->
      <g transform="translate(210, 0)">
        <rect width="195" height="225" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <!-- Icon Badge -->
        <rect x="16" y="16" width="36" height="36" rx="10" fill="#1e1b4b"/>
        <rect x="25" y="27" width="18" height="14" rx="2" stroke="#c084fc" stroke-width="1.6" fill="none"/>
        <polygon points="32,31 38,34 32,37" fill="#c084fc"/>
        <!-- Title & Status -->
        <text x="16" y="72" fill="#f8fafc" font-size="13" font-weight="700" class="font-sans">Xem Phim 4K / 8K</text>
        <rect x="16" y="82" width="76" height="18" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="24" y="94" fill="#34d399" font-size="9.5" font-weight="700" class="font-sans">● Mượt mà</text>
        <!-- Metrics -->
        <text x="16" y="124" fill="#94a3b8" font-size="11" class="font-sans">Tải xuống: <tspan fill="#38bdf8" font-weight="700">485.6 Mbps</tspan></text>
        <text x="16" y="142" fill="#94a3b8" font-size="11" class="font-sans">Độ phân giải: <tspan fill="#c084fc" font-weight="700">Ultra HD 60fps</tspan></text>
        <line x1="16" y1="156" x2="179" y2="156" stroke="#1e293b"/>
        <!-- Detail Text -->
        <text x="16" y="174" fill="#cbd5e1" font-size="10.5" class="font-sans">Băng thông dư dả truyền</text>
        <text x="16" y="190" fill="#cbd5e1" font-size="10.5" class="font-sans">tải đa luồng video 4K/8K</text>
        <text x="16" y="206" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">cho 5+ thiết bị cùng lúc.</text>
      </g>

      <!-- Card 3: Video Call & Conference -->
      <g transform="translate(420, 0)">
        <rect width="195" height="225" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <!-- Icon Badge -->
        <rect x="16" y="16" width="36" height="36" rx="10" fill="#064e3b"/>
        <circle cx="34" cy="30" r="5" stroke="#34d399" stroke-width="1.6" fill="none"/>
        <path d="M26 42 C26 38 30 36 34 36 C38 36 42 38 42 42" stroke="#34d399" stroke-width="1.6" fill="none"/>
        <!-- Title & Status -->
        <text x="16" y="72" fill="#f8fafc" font-size="13" font-weight="700" class="font-sans">Hội nghị Video Call</text>
        <rect x="16" y="82" width="76" height="18" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="24" y="94" fill="#34d399" font-size="9.5" font-weight="700" class="font-sans">● Hoàn hảo</text>
        <!-- Metrics -->
        <text x="16" y="124" fill="#94a3b8" font-size="11" class="font-sans">Tải lên: <tspan fill="#34d399" font-weight="700">124.2 Mbps</tspan></text>
        <text x="16" y="142" fill="#94a3b8" font-size="11" class="font-sans">Độ ổn định: <tspan fill="#34d399" font-weight="700">99.9%</tspan></text>
        <line x1="16" y1="156" x2="179" y2="156" stroke="#1e293b"/>
        <!-- Detail Text -->
        <text x="16" y="174" fill="#cbd5e1" font-size="10.5" class="font-sans">Âm thanh &amp; video sắc nét</text>
        <text x="16" y="190" fill="#cbd5e1" font-size="10.5" class="font-sans">trên Zoom, Google Meet,</text>
        <text x="16" y="206" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">không méo tiếng/drop hình.</text>
      </g>

      <!-- Card 4: Large File Upload / Download -->
      <g transform="translate(630, 0)">
        <rect width="195" height="225" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <!-- Icon Badge -->
        <rect x="16" y="16" width="36" height="36" rx="10" fill="#451a03"/>
        <path d="M34 26 L34 38 M30 34 L34 38 L38 34" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="26" y1="42" x2="42" y2="42" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Title & Status -->
        <text x="16" y="72" fill="#f8fafc" font-size="13" font-weight="700" class="font-sans">Tải Tệp Dung Lượng Lớn</text>
        <rect x="16" y="82" width="76" height="18" rx="5" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
        <text x="24" y="94" fill="#34d399" font-size="9.5" font-weight="700" class="font-sans">● Siêu tốc</text>
        <!-- Metrics -->
        <text x="16" y="124" fill="#94a3b8" font-size="11" class="font-sans">Tốc độ thực: <tspan fill="#fbbf24" font-weight="700">~60 MB/s</tspan></text>
        <text x="16" y="142" fill="#94a3b8" font-size="11" class="font-sans">Tệp 10GB: <tspan fill="#34d399" font-weight="700">~2.8 phút</tspan></text>
        <line x1="16" y1="156" x2="179" y2="156" stroke="#1e293b"/>
        <!-- Detail Text -->
        <text x="16" y="174" fill="#cbd5e1" font-size="10.5" class="font-sans">Tải game Steam 50GB</text>
        <text x="16" y="190" fill="#cbd5e1" font-size="10.5" class="font-sans">hoặc sao lưu file đám mây</text>
        <text x="16" y="206" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">chỉ trong vài phút.</text>
      </g>
    </g>
  </g>
</svg>
